<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b111c" />
    <title>Ari-folio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        font-family: "Inter Variable", Inter, sans-serif;
        background: #0b111c;
        color: #aeb9c8;
      }

      * { box-sizing: border-box; }
      html { scrollbar-color: #2b3a4c #0b111c; scrollbar-width: thin; }
      body { margin: 0; background: #0b111c; }
      a { color: inherit; }
      .page { min-height: 100vh; font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
      .shell { width: min(calc(100% - 48px), 1040px); margin: 0 auto; padding: 86px 0 72px; }
      .columns { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 84px; align-items: start; }
      .sidebar { position: sticky; top: 86px; min-width: 0; }
      .avatar { width: 104px; height: 104px; display: grid; place-items: center; border-radius: 50%; object-fit: cover; object-position: center; background: linear-gradient(135deg, #334155, #1e293b); color: #f4f6f8; border: 3px solid rgba(134, 239, 172, .86); font-size: 1.45rem; font-weight: 600; line-height: 1; }
      .name { margin: 22px 0 3px; color: #f4f6f8; font-size: 20px; font-weight: 600; line-height: 1.18; letter-spacing: -.02em; }
      .role, .location { margin: 6px 0 0; color: #aeb9c8; font-size: 14px; line-height: 1.4; }
      .location { margin-top: 2px; color: #929eb0; }
      .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 27px; }
      .links a { color: #929eb0; font-size: 14px; line-height: 1.2; text-decoration: none; white-space: nowrap; }
      .links a:hover, .links a:focus-visible { color: #f4f6f8; }
      .side-section { margin-top: 32px; }
      .side-section h2, .section-label { margin: 0 0 14px; color: #738197; font-size: 11px; font-weight: 500; letter-spacing: .08em; line-height: 1.2; text-transform: uppercase; }
      .education-list { display: grid; gap: 20px; }
      .education-item h3 { margin: 0; color: #eef2f6; font-size: 15px; font-weight: 600; line-height: 1.32; }
      .education-item p, .education-item span { margin: 0; color: #929eb0; font-size: 14px; line-height: 1.45; }
      .education-item span { display: block; margin-top: 4px; }
      .content { min-width: 0; display: grid; gap: 36px; }
      .section { min-width: 0; }
      .lead, .body, .company-description, .selected-work-description { max-width: 760px; color: #9eacbf; font-size: 15px; line-height: 1.6; }
      .lead { margin: 0; color: #b5c0cf; }
      .body { margin: 8px 0 0; }
      .callout { max-width: 760px; margin: 18px 0 0; padding-left: 14px; border-left: 2px solid rgba(115, 129, 151, .45); color: #eef2f6; font-size: 15px; font-weight: 600; line-height: 1.5; }
      .timeline, .selected-work-list { display: grid; gap: 28px; }
      .entry, .selected-work-item { min-width: 0; }
      .entry + .entry, .selected-work-item + .selected-work-item { padding-top: 24px; border-top: 1px solid rgba(115, 129, 151, .18); }
      .selected-work-list { gap: 20px; }
      .selected-work-item + .selected-work-item { padding-top: 20px; }
      .entry-top, .selected-work-top { display: grid; grid-template-columns: minmax(0, 1fr) max-content; gap: 20px; align-items: baseline; }
      .entry-top h3, .selected-work-title-line h3 { margin: 0; color: #f4f6f8; font-size: 16px; font-weight: 600; line-height: 1.35; }
      .entry-top span, .selected-work-top > span { color: #7f8da1; font-size: 14px; line-height: 1.35; white-space: nowrap; }
      .company-description { margin: 8px 0 0; }
      .work-list { margin: 12px 0 0; padding: 0 0 0 15px; }
      .work-list li { margin-top: 7px; padding-left: 3px; color: #9eacbf; font-size: 15px; line-height: 1.6; }
      .work-list li::marker { color: #738197; }
      strong { color: #eef2f6; font-weight: 600; }
      .selected-work-title-line { display: flex; flex-wrap: wrap; gap: 5px; align-items: baseline; }
      .selected-work-title-line h3 a { text-decoration: underline; text-decoration-color: rgba(174, 185, 200, .34); text-decoration-thickness: .06em; text-underline-offset: 2px; }
      .selected-work-title-line h3 a:hover, .selected-work-title-line h3 a:focus-visible { color: #f4f6f8; text-decoration-color: rgba(244, 246, 248, .62); }
      .selected-work-title-line p { margin: 0; color: #9eacbf; font-size: 15px; line-height: 1.45; }
      .selected-work-title-line p::before { content: "."; margin: 0 4px 0 1px; color: #738197; }
      .selected-work-description { margin: 6px 0 0; }
      .footer { margin-top: 36px; padding-top: 24px; border-top: 1px solid rgba(115, 129, 151, .16); text-align: center; }
      .footer p { margin: 0; color: rgba(115, 129, 151, .78); font-size: 12px; line-height: 1.5; }
      .status { max-width: 540px; margin: 12vh auto; padding: 24px; border: 1px solid rgba(115, 129, 151, .22); color: #aeb9c8; }
      .status strong { display: block; margin-bottom: 8px; color: #f4f6f8; }

      @media (max-width: 820px) {
        .shell { width: min(calc(100% - 36px), 640px); padding: 54px 0 64px; }
        .columns { grid-template-columns: 1fr; gap: 38px; }
        .sidebar { position: static; max-width: 320px; }
        .education-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
      }

      @media (max-width: 560px) {
        .shell { width: min(calc(100% - 32px), 430px); padding-top: 42px; }
        .avatar { width: 90px; height: 90px; font-size: 1.25rem; }
        .name { margin-top: 18px; font-size: 1.16rem; }
        .education-list { grid-template-columns: 1fr; gap: 22px; }
        .footer { margin-top: 44px; }
        .entry-top, .selected-work-top { grid-template-columns: 1fr; gap: 4px; }
        .entry-top span, .selected-work-top > span { white-space: normal; }
      }
    </style>
  </head>
  <body>
    <main id="app" class="page" aria-live="polite">
      <div class="status"><strong>Loading profile…</strong><span>Reading data.json</span></div>
    </main>

    <script>
      const app = document.getElementById('app');

      const text = (value) => document.createTextNode(value == null ? '' : String(value));
      const el = (tag, className, content) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (content !== undefined) node.append(content instanceof Node ? content : text(content));
        return node;
      };
      const list = (items, renderItem) => {
        const fragment = document.createDocumentFragment();
        (Array.isArray(items) ? items : []).forEach((item, index) => fragment.append(renderItem(item, index)));
        return fragment;
      };
      const external = (href) => /^https?:\/\//i.test(String(href || ''));
      const initials = (name) => String(name || '').split(/\s+/).filter(Boolean).slice(0, 2).map((part) => part[0]).join('').toUpperCase();
      const degreeLines = (degree) => String(degree || '').split(',').map((line) => line.trim()).filter(Boolean).map((line, index, parts) => index < parts.length - 1 ? line + ',' : line);

      function section(label, children) {
        const node = el('section', 'section');
        node.append(el('h2', 'section-label', label), children);
        return node;
      }

      function linkNode(label, href) {
        const link = el('a', '', label);
        link.href = href;
        if (external(href)) { link.target = '_blank'; link.rel = 'noreferrer'; }
        return link;
      }

      function render(data) {
        document.title = data.role ? `${data.name || 'Profile'} | ${data.role}` : (data.name || 'Profile');
        app.replaceChildren();

        const shell = el('div', 'shell');
        const columns = el('div', 'columns');
        const sidebar = el('aside', 'sidebar');
        const content = el('div', 'content');
        const profileName = data.name || 'Profile';

        if (data.dp) {
          const image = el('img', 'avatar');
          image.src = data.dp;
          image.alt = profileName;
          image.onerror = () => { image.replaceWith(el('div', 'avatar', initials(profileName))); };
          sidebar.append(image);
        } else sidebar.append(el('div', 'avatar', initials(profileName)));

        sidebar.append(el('h1', 'name', profileName));
        if (data.role) sidebar.append(el('p', 'role', data.role));
        if (data.location) sidebar.append(el('p', 'location', data.location));

        const links = Object.entries(data.links || {});
        if (links.length) {
          const nav = el('nav', 'links');
          nav.setAttribute('aria-label', 'Profile links');
          links.forEach(([label, href]) => nav.append(linkNode(label, href)));
          sidebar.append(nav);
        }

        if (Array.isArray(data.education) && data.education.length) {
          const sideSection = el('section', 'side-section');
          sideSection.append(el('h2', '', 'Education'));
          const education = el('div', 'education-list');
          education.append(list(data.education, (item) => {
            const article = el('article', 'education-item');
            article.append(el('h3', '', item.collegename || item.school || ''));
            degreeLines(item.degree).forEach((line) => article.append(el('p', '', line)));
            if (item.field) article.append(el('p', '', item.field));
            if (item.cgpa) article.append(el('p', '', `GPA: ${item.cgpa}`));
            if (item.daterange || item.date) article.append(el('span', '', item.daterange || item.date));
            return article;
          }));
          sideSection.append(education);
          sidebar.append(sideSection);
        }

        if (data.about || data.currently_looking_for) {
          const about = el('div');
          if (data.about) about.append(el('p', 'lead', data.about));
          if (data.currently_looking_for) about.append(el('p', 'callout', data.currently_looking_for));
          content.append(section('About', about));
        }

        if (Array.isArray(data.experience) && data.experience.length) {
          const timeline = el('div', 'timeline');
          timeline.append(list(data.experience, (item) => {
            const article = el('article', 'entry');
            const top = el('div', 'entry-top');
            top.append(el('h3', '', [item.role, item.company].filter(Boolean).join(', ')));
            top.append(el('span', '', item.daterange || ''));
            article.append(top);
            if (item.description) article.append(el('p', 'company-description', item.description));
            if (Array.isArray(item.work) && item.work.length) {
              const work = el('ul', 'work-list');
              work.append(list(item.work, (entry) => {
                const li = el('li');
                li.append(el('strong', '', `${entry.workname || 'Work'}. `), text(entry.description || ''));
                return li;
              }));
              article.append(work);
            }
            return article;
          }));
          content.append(section('Experience', timeline));
        }

        if (Array.isArray(data.selected_work) && data.selected_work.length) {
          const workList = el('div', 'selected-work-list');
          workList.append(list(data.selected_work, (item) => {
            const article = el('article', 'selected-work-item');
            const top = el('div', 'selected-work-top');
            const titleLine = el('div', 'selected-work-title-line');
            const heading = el('h3');
            heading.append(item.link ? linkNode(item.name || 'Project', item.link) : text(item.name || 'Project'));
            titleLine.append(heading);
            if (item.oneliner) titleLine.append(el('p', '', item.oneliner));
            top.append(titleLine, el('span', '', item.year || ''));
            article.append(top);
            if (item.description) article.append(el('p', 'selected-work-description', item.description));
            return article;
          }));
          content.append(section('Selected Work', workList));
        }

        if (Array.isArray(data.research) && data.research.length) {
          const timeline = el('div', 'timeline');
          timeline.append(list(data.research, (item) => {
            const article = el('article', 'entry');
            const top = el('div', 'entry-top');
            top.append(el('h3', '', item.name || 'Research'));
            top.append(el('span', '', item.daterange || ''));
            article.append(top);
            if (item.oneliner) article.append(el('p', 'body', item.oneliner));
            if (item.description) article.append(el('p', 'body', item.description));
            return article;
          }));
          content.append(section('Research', timeline));
        }

        columns.append(sidebar, content);
        shell.append(columns);
        const footer = el('footer', 'footer');
        footer.append(el('p', `© ${new Date().getFullYear()} ${profileName}`));
        shell.append(footer);
        app.append(shell);
      }

      fetch('./data.json')
        .then((response) => { if (!response.ok) throw new Error(`data.json returned ${response.status}`); return response.json(); })
        .then(render)
        .catch((error) => {
          app.replaceChildren();
          const status = el('div', 'status');
          status.append(el('strong', '', 'Could not load data.json'), el('span', '', `${error.message}. Serve this folder with a static server and open index.html there.`));
          app.append(status);
        });
    </script>
  </body>
</html>
